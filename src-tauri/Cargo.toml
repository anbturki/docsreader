[package]
name = "docsreader"
version = "0.5.0"
description = "Markdown documentation reader"
authors = ["Ali Turki"]
edition = "2021"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
# The `_lib` suffix is needed to keep the lib name unique from the bin name on Windows.
# See https://github.com/rust-lang/cargo/issues/8519
name = "docsreader_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["protocol-asset"] }
tauri-plugin-opener = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tauri-plugin-dialog = "2"
tauri-plugin-fs = { version = "2", features = ["watch"] }
tauri-plugin-store = "2"
walkdir = "2"
serde_yaml = "0.9"
rayon = "1.12.0"
tauri-plugin-updater = "2"
tokio = { version = "1.52.2", features = ["process", "time"] }
tauri-plugin-process = "2.3.1"

