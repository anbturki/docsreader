<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024" width="1024" height="1024">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#7C3AED"/>
      <stop offset="55%" stop-color="#6366F1"/>
      <stop offset="100%" stop-color="#3730A3"/>
    </linearGradient>
    <linearGradient id="hashWhite" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#FFFFFF"/>
      <stop offset="100%" stop-color="#E0E7FF"/>
    </linearGradient>
    <linearGradient id="hashAccent" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#FB923C"/>
      <stop offset="100%" stop-color="#EA580C"/>
    </linearGradient>
    <radialGradient id="topGlow" cx="50%" cy="0%" r="65%">
      <stop offset="0%" stop-color="#FFFFFF" stop-opacity="0.22"/>
      <stop offset="60%" stop-color="#FFFFFF" stop-opacity="0"/>
    </radialGradient>
    <filter id="tileShadow" x="-10%" y="-5%" width="120%" height="120%">
      <feGaussianBlur in="SourceAlpha" stdDeviation="10"/>
      <feOffset dx="0" dy="8" result="off"/>
      <feComponentTransfer><feFuncA type="linear" slope="0.28"/></feComponentTransfer>
      <feMerge><feMergeNode/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <filter id="hashShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur in="SourceAlpha" stdDeviation="8"/>
      <feOffset dx="0" dy="6" result="off"/>
      <feComponentTransfer><feFuncA type="linear" slope="0.4"/></feComponentTransfer>
      <feMerge><feMergeNode/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>

  <!--
    macOS app icon spec: 1024x1024 canvas with content tile of ~824x824
    centered, leaving ~100px transparent margin on each side.
    See https://developer.apple.com/design/human-interface-guidelines/app-icons
  -->

  <!-- Squircle tile (824x824 centered, rx=185 ~ 22.4% radius) -->
  <g filter="url(#tileShadow)">
    <rect x="100" y="100" width="824" height="824" rx="185" ry="185" fill="url(#bg)"/>
    <rect x="100" y="100" width="824" height="824" rx="185" ry="185" fill="url(#topGlow)"/>
  </g>

  <!--
    # symbol: centered at (512, 512), spans 480x480
    Bars are 60px thick, positioned at the 1/3 and 2/3 lines of the # box
  -->
  <g transform="translate(512 512)" filter="url(#hashShadow)">
    <!-- Left vertical (centered at x=-80) -->
    <rect x="-110" y="-240" width="60" height="480" rx="30" fill="url(#hashWhite)"/>
    <!-- Right vertical (centered at x=80) -->
    <rect x="50" y="-240" width="60" height="480" rx="30" fill="url(#hashWhite)"/>
    <!-- Top horizontal (accent coral) (centered at y=-80) -->
    <rect x="-240" y="-110" width="480" height="60" rx="30" fill="url(#hashAccent)"/>
    <!-- Bottom horizontal (centered at y=80) -->
    <rect x="-240" y="50" width="480" height="60" rx="30" fill="url(#hashWhite)"/>
  </g>
</svg>
