[package]
name = "docsreader-mcp"
version = "0.6.2"
edition = "2024"

[dependencies]
chrono = { version = "0.4.45", default-features = false, features = ["clock", "std"] }
docsreader-core = { version = "0.6.0", path = "../core", features = ["schemars"] }
rmcp = { version = "2.0.0", features = ["server", "macros", "transport-io", "elicitation"] }
schemars = "1.2.1"
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.150"
tokio = { version = "1.52.3", features = ["rt-multi-thread", "macros"] }
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.23", default-features = false, features = ["env-filter", "fmt", "std", "ansi"] }

[dev-dependencies]
tempfile = "3.27.0"
