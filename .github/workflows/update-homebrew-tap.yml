name: Update Homebrew Tap

on:
  workflow_dispatch:
    inputs:
      tag:
        description: "Release tag to publish to the tap (e.g. v0.1.0)"
        required: true

jobs:
  update-tap:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    env:
      TAG: ${{ inputs.tag }}
    steps:
      - name: Determine version
        id: version
        run: echo "version=${TAG#v}" >> "$GITHUB_OUTPUT"

      - name: Wait for release assets to be available
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -e
          for i in $(seq 1 30); do
            if gh release view "$TAG" \
                --repo anbturki/docsreader \
                --json assets \
                --jq '.assets[].name' | grep -q 'universal.dmg$'; then
              exit 0
            fi
            echo "waiting for universal.dmg asset (attempt $i)..."
            sleep 20
          done
          echo "timed out waiting for assets" >&2
          exit 1

      - name: Compute DMG SHA256
        id: sha
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -e
          DMG_NAME=$(gh release view "$TAG" \
            --repo anbturki/docsreader \
            --json assets --jq '.assets[].name' \
            | grep 'universal.dmg$' | head -n1)
          gh release download "$TAG" \
            --repo anbturki/docsreader \
            --pattern "$DMG_NAME"
          SHA=$(shasum -a 256 "$DMG_NAME" | awk '{print $1}')
          echo "dmg_name=$DMG_NAME" >> "$GITHUB_OUTPUT"
          echo "sha256=$SHA" >> "$GITHUB_OUTPUT"

      - name: Checkout homebrew tap
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5  # v4
        with:
          repository: anbturki/homebrew-tap
          token: ${{ secrets.TAP_GITHUB_TOKEN }}
          path: tap

      - name: Update cask
        env:
          VERSION: ${{ steps.version.outputs.version }}
          SHA256: ${{ steps.sha.outputs.sha256 }}
          DMG_NAME: ${{ steps.sha.outputs.dmg_name }}
        run: |
          mkdir -p tap/Casks
          cat > tap/Casks/docsreader.rb <<EOF
          cask "docsreader" do
            version "${VERSION}"
            sha256 "${SHA256}"

            url "https://github.com/anbturki/docsreader/releases/download/v#{version}/${DMG_NAME}"
            name "DocsReader"
            desc "Markdown documentation reader"
            homepage "https://github.com/anbturki/docsreader"

            app "DocsReader.app"
            binary "#{appdir}/DocsReader.app/Contents/MacOS/docsreader-mcp"

            zap trash: [
              "~/Library/Application Support/com.docsreader.app",
              "~/Library/Caches/com.docsreader.app",
              "~/Library/Preferences/com.docsreader.app.plist",
            ]
          end
          EOF

      - name: Commit and push tap
        working-directory: tap
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add Casks/docsreader.rb
          if git diff --staged --quiet; then
            echo "no changes to commit"
            exit 0
          fi
          git commit -m "docsreader ${VERSION}"
          git push
