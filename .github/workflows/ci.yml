name: CI

on:
  pull_request:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5  # v4

      - name: Install Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6  # v2

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@29eef336d9b2848a0b548edc03f92a220660cdb8  # stable
        with:
          components: rustfmt, clippy

      # The GUI crate links tauri, which needs webkit at compile time.
      - name: Install Linux deps
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf

      - name: Cache cargo
        uses: swatinem/rust-cache@e18b497796c12c097a38f9edb9d0641fb99eee32  # v2
        with:
          workspaces: src-tauri

      - name: Install JS deps
        run: bun install

      - name: Typecheck frontend
        run: bunx tsc --noEmit

      - name: Frontend tests
        run: bun run test

      - name: Frontend build
        run: bun run build

      - name: Rust format
        working-directory: src-tauri
        run: cargo fmt --check

      - name: Rust lints
        working-directory: src-tauri
        run: cargo clippy --workspace --all-targets -- -D warnings

      - name: Rust tests (unit + MCP stdio integration)
        working-directory: src-tauri
        run: cargo test --workspace

      - name: MCP binary stays tauri-free
        working-directory: src-tauri
        run: |
          COUNT=$(cargo tree -p docsreader-mcp | grep -c " tauri v" || true)
          test "$COUNT" -eq 0 || { echo "::error::tauri leaked into docsreader-mcp"; exit 1; }
