name: Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      tag:
        description: "Existing tag to attach builds to (e.g. v0.1.0)"
        required: true
      platforms:
        description: "Platforms to build"
        type: choice
        default: all
        options:
          - all
          - macos-only
          - linux-only
          - windows-only
          - linux-windows

jobs:
  setup:
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.pick.outputs.matrix }}
      ref: ${{ steps.pick.outputs.ref }}
      tag: ${{ steps.pick.outputs.tag }}
      macos_included: ${{ steps.pick.outputs.macos_included }}
    steps:
      - id: pick
        run: |
          MAC='{"platform":"macos-latest","args":"--target universal-apple-darwin --skip-stapling"}'
          LIN='{"platform":"ubuntu-22.04","args":""}'
          WIN='{"platform":"windows-latest","args":""}'
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            TAG="${{ inputs.tag }}"
            case "${{ inputs.platforms }}" in
              macos-only)     INCLUDE="[$MAC]";          MAC_IN=true ;;
              linux-only)     INCLUDE="[$LIN]";          MAC_IN=false ;;
              windows-only)   INCLUDE="[$WIN]";          MAC_IN=false ;;
              linux-windows)  INCLUDE="[$LIN,$WIN]";     MAC_IN=false ;;
              *)              INCLUDE="[$MAC,$LIN,$WIN]"; MAC_IN=true ;;
            esac
          else
            TAG="${GITHUB_REF_NAME}"
            INCLUDE="[$MAC,$LIN,$WIN]"
            MAC_IN=true
          fi
          echo "matrix={\"include\":$INCLUDE}" >> "$GITHUB_OUTPUT"
          echo "ref=refs/tags/$TAG" >> "$GITHUB_OUTPUT"
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          echo "macos_included=$MAC_IN" >> "$GITHUB_OUTPUT"

  publish-tauri:
    needs: setup
    permissions:
      contents: write
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.setup.outputs.matrix) }}

    runs-on: ${{ matrix.platform }}
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5  # v4
        with:
          ref: ${{ needs.setup.outputs.ref }}

      - name: Install Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6  # v2

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@29eef336d9b2848a0b548edc03f92a220660cdb8  # stable
        with:
          targets: ${{ matrix.platform == 'macos-latest' && 'aarch64-apple-darwin,x86_64-apple-darwin' || '' }}

      - name: Install Linux deps
        if: matrix.platform == 'ubuntu-22.04'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf

      - name: Cache cargo
        uses: swatinem/rust-cache@e18b497796c12c097a38f9edb9d0641fb99eee32  # v2
        with:
          workspaces: src-tauri

      - name: Install JS deps
        run: bun install

      - name: Write App Store Connect API key
        if: matrix.platform == 'macos-latest'
        run: |
          mkdir -p "$RUNNER_TEMP/appstore"
          KEY_PATH="$RUNNER_TEMP/appstore/AuthKey_${{ secrets.APPLE_API_KEY }}.p8"
          printf '%s' "${{ secrets.APPLE_API_KEY_BASE64 }}" | base64 --decode > "$KEY_PATH"
          chmod 600 "$KEY_PATH"
          echo "APPLE_API_KEY_PATH=$KEY_PATH" >> "$GITHUB_ENV"

      - name: Build & release
        uses: tauri-apps/tauri-action@84b9d35b5fc46c1e45415bdb6144030364f7ebc5  # v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # Updater signing
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
          # macOS code signing
          APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          # macOS notarization via App Store Connect API key
          APPLE_API_ISSUER: ${{ secrets.APPLE_API_ISSUER }}
          APPLE_API_KEY: ${{ secrets.APPLE_API_KEY }}
        with:
          tagName: ${{ needs.setup.outputs.tag }}
          releaseName: "DocsReader ${{ needs.setup.outputs.tag }}"
          releaseBody: |
            See assets below to download and install.

            Install via Homebrew:
            ```
            brew install --cask anbturki/tap/docsreader
            ```

            Install via curl:
            ```
            curl -fsSL https://raw.githubusercontent.com/anbturki/docsreader/main/install.sh | bash
            ```
          releaseDraft: true
          prerelease: false
          args: ${{ matrix.args }}

  update-homebrew-tap:
    needs: [setup, publish-tauri]
    runs-on: ubuntu-latest
    if: needs.setup.outputs.macos_included == 'true'
    env:
      TAG: ${{ needs.setup.outputs.tag }}
    steps:
      - name: Determine version
        id: version
        run: echo "version=${TAG#v}" >> "$GITHUB_OUTPUT"

      - name: Wait for release assets to be available
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -e
          for i in $(seq 1 30); do
            if gh release view "$TAG" \
                --repo anbturki/docsreader \
                --json assets \
                --jq '.assets[].name' | grep -q 'universal.dmg$'; then
              exit 0
            fi
            echo "waiting for universal.dmg asset (attempt $i)..."
            sleep 20
          done
          echo "timed out waiting for assets" >&2
          exit 1

      - name: Compute DMG SHA256
        id: sha
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -e
          DMG_NAME=$(gh release view "$TAG" \
            --repo anbturki/docsreader \
            --json assets --jq '.assets[].name' \
            | grep 'universal.dmg$' | head -n1)
          gh release download "$TAG" \
            --repo anbturki/docsreader \
            --pattern "$DMG_NAME"
          SHA=$(shasum -a 256 "$DMG_NAME" | awk '{print $1}')
          echo "dmg_name=$DMG_NAME" >> "$GITHUB_OUTPUT"
          echo "sha256=$SHA" >> "$GITHUB_OUTPUT"

      - name: Checkout homebrew tap
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5  # v4
        with:
          repository: anbturki/homebrew-tap
          token: ${{ secrets.TAP_GITHUB_TOKEN }}
          path: tap

      - name: Update cask
        env:
          VERSION: ${{ steps.version.outputs.version }}
          SHA256: ${{ steps.sha.outputs.sha256 }}
          DMG_NAME: ${{ steps.sha.outputs.dmg_name }}
        run: |
          mkdir -p tap/Casks
          cat > tap/Casks/docsreader.rb <<EOF
          cask "docsreader" do
            version "${VERSION}"
            sha256 "${SHA256}"

            url "https://github.com/anbturki/docsreader/releases/download/v#{version}/${DMG_NAME}"
            name "DocsReader"
            desc "Markdown documentation reader"
            homepage "https://github.com/anbturki/docsreader"

            app "DocsReader.app"

            zap trash: [
              "~/Library/Application Support/com.docsreader.app",
              "~/Library/Caches/com.docsreader.app",
              "~/Library/Preferences/com.docsreader.app.plist",
            ]
          end
          EOF

      - name: Commit and push tap
        working-directory: tap
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add Casks/docsreader.rb
          if git diff --staged --quiet; then
            echo "no changes to commit"
            exit 0
          fi
          git commit -m "docsreader ${VERSION}"
          git push
