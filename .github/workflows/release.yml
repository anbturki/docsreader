name: Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      tag:
        description: "Existing tag to attach builds to (e.g. v0.1.0)"
        required: true
      platforms:
        description: "Platforms to build"
        type: choice
        default: all
        options:
          - all
          - macos-only
          - linux-only
          - windows-only
          - linux-windows

jobs:
  setup:
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.pick.outputs.matrix }}
      ref: ${{ steps.pick.outputs.ref }}
      tag: ${{ steps.pick.outputs.tag }}
      macos_included: ${{ steps.pick.outputs.macos_included }}
    steps:
      - id: pick
        run: |
          # The sidecar overlay adds bundle.externalBin (docsreader-mcp) and a
          # beforeBuildCommand that builds it; the base config stays sidecar-free
          # so plain `cargo build`/`tauri dev` never require the staged binary.
          SIDECAR='--config src-tauri/tauri.sidecar.conf.json'
          MAC="{\"platform\":\"macos-latest\",\"args\":\"--target universal-apple-darwin --skip-stapling $SIDECAR\"}"
          LIN="{\"platform\":\"ubuntu-22.04\",\"args\":\"$SIDECAR\"}"
          WIN="{\"platform\":\"windows-latest\",\"args\":\"$SIDECAR\"}"
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            TAG="${{ inputs.tag }}"
            case "${{ inputs.platforms }}" in
              macos-only)     INCLUDE="[$MAC]";          MAC_IN=true ;;
              linux-only)     INCLUDE="[$LIN]";          MAC_IN=false ;;
              windows-only)   INCLUDE="[$WIN]";          MAC_IN=false ;;
              linux-windows)  INCLUDE="[$LIN,$WIN]";     MAC_IN=false ;;
              *)              INCLUDE="[$MAC,$LIN,$WIN]"; MAC_IN=true ;;
            esac
          else
            TAG="${GITHUB_REF_NAME}"
            INCLUDE="[$MAC,$LIN,$WIN]"
            MAC_IN=true
          fi
          echo "matrix={\"include\":$INCLUDE}" >> "$GITHUB_OUTPUT"
          echo "ref=refs/tags/$TAG" >> "$GITHUB_OUTPUT"
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          echo "macos_included=$MAC_IN" >> "$GITHUB_OUTPUT"

  publish-tauri:
    needs: setup
    permissions:
      contents: write
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.setup.outputs.matrix) }}

    runs-on: ${{ matrix.platform }}
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5  # v4
        with:
          ref: ${{ needs.setup.outputs.ref }}

      - name: Install Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6  # v2

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@29eef336d9b2848a0b548edc03f92a220660cdb8  # stable
        with:
          targets: ${{ matrix.platform == 'macos-latest' && 'aarch64-apple-darwin,x86_64-apple-darwin' || '' }}

      - name: Install Linux deps
        if: matrix.platform == 'ubuntu-22.04'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf

      - name: Cache cargo
        uses: swatinem/rust-cache@e18b497796c12c097a38f9edb9d0641fb99eee32  # v2
        with:
          workspaces: src-tauri

      - name: Install JS deps
        run: bun install

      - name: Write App Store Connect API key
        if: matrix.platform == 'macos-latest'
        run: |
          mkdir -p "$RUNNER_TEMP/appstore"
          KEY_PATH="$RUNNER_TEMP/appstore/AuthKey_${{ secrets.APPLE_API_KEY }}.p8"
          printf '%s' "${{ secrets.APPLE_API_KEY_BASE64 }}" | base64 --decode > "$KEY_PATH"
          chmod 600 "$KEY_PATH"
          echo "APPLE_API_KEY_PATH=$KEY_PATH" >> "$GITHUB_ENV"

      # Build & sign. Notarization is intentionally skipped here (no
      # APPLE_API_ISSUER/APPLE_API_KEY in env), so tauri-action exits
      # immediately on macOS. The release is published immediately so
      # Linux/Windows users aren't blocked by Apple's queue. The macOS
      # DMG is signed (Gatekeeper online check passes once Apple says
      # Accepted) and the notarize-staple workflow swaps in the stapled
      # DMG when Apple finishes.
      - name: Build & publish release
        uses: tauri-apps/tauri-action@84b9d35b5fc46c1e45415bdb6144030364f7ebc5  # v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # Updater signing
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
          # macOS code signing
          APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        with:
          tagName: ${{ needs.setup.outputs.tag }}
          releaseName: "DocsReader ${{ needs.setup.outputs.tag }}"
          releaseBody: |
            See assets below to download and install.

            Install via Homebrew:
            ```
            brew install --cask anbturki/tap/docsreader
            ```

            Install via curl:
            ```
            curl -fsSL https://raw.githubusercontent.com/anbturki/docsreader/main/install.sh | bash
            ```
          releaseDraft: false
          prerelease: false
          args: ${{ matrix.args }}

      # The bundler copies externalBin into the app bundle and signs it with
      # the app (tauri-bundler sign_paths), so DMG notarization covers the
      # sidecar too. These asserts fail the release if the sidecar is absent.
      - name: Verify sidecar in bundle (macOS)
        if: matrix.platform == 'macos-latest'
        run: |
          set -euo pipefail
          APP=$(find src-tauri/target/universal-apple-darwin/release/bundle/macos -name '*.app' -maxdepth 1 | head -1)
          SIDECAR="$APP/Contents/MacOS/docsreader-mcp"
          test -f "$SIDECAR" || { echo "::error::sidecar missing from $APP"; exit 1; }
          lipo -archs "$SIDECAR" | grep -q "x86_64 arm64" || { echo "::error::sidecar is not universal"; exit 1; }
          codesign --verify --strict "$SIDECAR"
          echo "sidecar present, universal, and signed"

      - name: Verify sidecar in bundle (Linux)
        if: matrix.platform == 'ubuntu-22.04'
        run: |
          set -euo pipefail
          DEB=$(find src-tauri/target/release/bundle/deb -name '*.deb' | head -1)
          dpkg-deb -c "$DEB" | grep -q 'usr/bin/docsreader-mcp' || { echo "::error::sidecar missing from $DEB"; exit 1; }
          echo "sidecar present in deb"

      # macOS-only: submit the DMG to Apple async (no --wait), then stash
      # the submission id in the release body alongside a user-facing
      # warning. notarize-staple.yml polls Apple, staples the DMG when
      # accepted, swaps in the stapled asset, and strips both the marker
      # and the warning from the body.
      - name: Submit macOS DMG for async notarization
        if: matrix.platform == 'macos-latest'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
          TAG: ${{ needs.setup.outputs.tag }}
          API_KEY_PATH: ${{ env.APPLE_API_KEY_PATH }}
          API_KEY_ID: ${{ secrets.APPLE_API_KEY }}
          API_ISSUER: ${{ secrets.APPLE_API_ISSUER }}
        run: |
          set -euo pipefail

          DMG=$(find src-tauri/target/universal-apple-darwin/release/bundle/dmg -name '*.dmg' | head -1)
          if [ -z "$DMG" ]; then
            echo "::error::No DMG produced"
            exit 1
          fi
          echo "Submitting $DMG"

          OUTPUT=$(xcrun notarytool submit "$DMG" \
            --key "$API_KEY_PATH" \
            --key-id "$API_KEY_ID" \
            --issuer "$API_ISSUER" \
            --no-wait \
            --output-format json)
          echo "$OUTPUT"
          SUBMISSION_ID=$(echo "$OUTPUT" | jq -r .id)
          if [ -z "$SUBMISSION_ID" ] || [ "$SUBMISSION_ID" = "null" ]; then
            echo "::error::Failed to extract submission id"
            exit 1
          fi
          echo "Submission ID: $SUBMISSION_ID"

          BODY=$(gh release view "$TAG" --repo "$REPO" --json body --jq .body)
          WARNING='> [!NOTE]
          > **macOS notarization in progress.** Gatekeeper may prompt on first launch until Apple finishes (~5-30 min, occasionally longer). Right-click the app and choose Open as a workaround. This message disappears automatically once stapling completes.'
          NEW_BODY=$(printf '%s\n\n%s\n\n<!-- notarize: id=%s status=pending -->\n' "$BODY" "$WARNING" "$SUBMISSION_ID")
          gh release edit "$TAG" --repo "$REPO" --notes "$NEW_BODY"
